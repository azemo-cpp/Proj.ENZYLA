<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daryl demo</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; color: #1a1b1e; background: #f6f7f9; }
    header { padding: 16px 24px; background: #101223; color: #fff; }
    main { display: grid; grid-template-columns: 1fr minmax(300px, 420px); gap: 24px; max-width: 1000px; margin: 24px auto; padding: 0 16px; }
    .content { background: #fff; padding: 20px; border-radius: 12px; border: 1px solid #d0d5dd; }
    #daryl-box { height: 520px; }
    @media (max-width: 760px) { main { grid-template-columns: 1fr; } }
    @media (prefers-color-scheme: dark) {
      body { background: #0e0f13; color: #e8eaed; }
      .content { background: #16181d; border-color: #3a3f4a; }
    }
  </style>
</head>
<body>
  <header><strong>Your website</strong> (demo page ito)</header>
  <main>
    <div class="content">
      <h1>Lunar landing site planner</h1>
      <p>This is a stand-in for the real website. Daryl lives in the box on the right, sa designated place niya.
         Ang box ang nagdedesisyon ng size.</p>
      <p>See <code>INTEGRATION.md</code> for how to add him to your own page.</p>
    </div>
    <div id="daryl-box"></div>
  </main>
  <script src="/daryl-widget.js"></script>
  <script src="/demo.js"></script>
</body>
</html>
